# Бот сигналов для ручной торговли. Скопируйте в signals.toml: python signals.py -c signals.toml run
# Ключи API бирже не нужны. Для Telegram: TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID в переменных окружения.
# Правила — из research/CONFLUENCE_REPORT.md (раздел «Улучшение»).

exchange = "binance"
universe_size = 20          # топ-20 спотовых пар по объёму
exclude = []

# Вход
min_votes = 15              # все 15 стратегий «за»
sides = ["long"]            # шорты в исследовании хуже случайных
top_k_filter = 3            # только монеты из топ-3 по силе относительно BTC за 7 дней

# Выход
sl_atr = 2.0                # стоп-лосс — поставить сразу при входе
tp_atr = 0.0                # тейк-профит не ставить: выход по сообщению бота
exit_votes = 10             # бот скажет «выходите», когда «за» станет меньше 10 из 15
max_hold_h = 72             # в любом случае закрыть через 72 ч

deposit_usdt = 1000.0       # ваш депозит — для расчёта размера позиции
risk_pct = 1.0              # сколько % депозита потерять, если сработает стоп

check_minutes = 5
state_file = "data/signals_state.json"
